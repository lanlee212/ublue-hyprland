---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: ublue-hyprland
# description will be included in the image's metadata
description: Minimal Hyprland + Noctalia desktop image (Fedora Atomic)

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest # F44 today; pin to a Fedora version (e.g. 44) for reproducibility

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into your image's root folder /

  # RPM Fusion first: steam + codecs live there (ublue base ships negativo17, not rpmfusion).
  # Terra: noctalia-greeter (greetd-based Noctalia login screen) — not in default Fedora repos.
  - type: script
    snippets:
      - dnf5 -y install https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
      - dnf5 -y install https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm
      - dnf5 -y install --nogpgcheck --repofrompath 'terra,https://repos.fyralabs.com/terra$releasever' terra-release

  # Desktop runtime + compositor + shell + apps
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland     # hyprland 0.56.x + xdg-desktop-portal-hyprland + ecosystem
        - scottames/ghostty       # terminal (matches Lee's desktop)
        - aeiro/nwg-shell         # nwg-look
        - faugus/faugus-launcher  # faugus launcher
        - imput/helium
        - che/nerd-fonts
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo   # brave-origin (official Brave repo)
    install:
      packages:
        # compositor & shell (noctalia 5.x is in default Fedora 44 repos)
        - hyprland
        # - umbriel-nightly
        - xdg-desktop-portal-hyprland
        - hyprland-guiutils         # silences 0.56's startup nag (hyprland-dialog on PATH); same COPR
        - noctalia
        - foot
        # graphical login: greetd + Noctalia Greeter (Noctalia-styled login screen, replaces sddm)
        - greetd
        - noctalia-greeter          # from Terra repo (added by the script module above)
        - systemd-pam               # pam_systemd.so — F44 split; greetd's PAM session line needs it
        # desktop services the lean base-main image doesn't ship
        - pipewire
        - pipewire-pulse
        - wireplumber
        - polkit
        - power-profiles-daemon
        # Secret Service provider. Apps keep credentials here (Chromium-family
        # "safe storage", megasync, mail clients, git helpers); without it they
        # silently fail to persist and re-ask every session. gnome-keyring-pam
        # ships pam_gnome_keyring.so, which /etc/pam.d/greetd already references
        # with dash-prefixed (ignore-if-missing) lines, so installing it makes the
        # login auto-unlock the keyring with the user's login password.
        - gnome-keyring
        - gnome-keyring-pam
        # DNS content filter (adult-content blocklist): local filtering resolver
        - dnsmasq
        - curl
        # Printing + scanning. base-main already has cups, cups-filters(+driverless)
        # and avahi, but the L2740DW is a Gen1 (GDI) Brother: neither PCL nor
        # PostScript, so the generic drivers produce garbage and brlaser is the
        # driver that works. All pinned here so a base change can't drop them.
        - printer-driver-brlaser
        - system-config-printer     # GUI to add/manage queues (polkit prompt)
        - cups-browsed              # IPP/AirPrint discovery for network printers
        - sane-airscan              # driverless scanning (eSCL/WSD) over the LAN
        - simple-scan               # scanning GUI
        # apps (Lee)
        - brave-origin             # from the official Brave repo (added above)
        - geany
        - steam
        - xarchiver
        - nemo
        - ripgrep
        - nodejs
        - nwg-look
        - adw-gtk3-theme
        - papirus-icon-theme
        - abattis-cantarell-fonts
        - fira-code-fonts
        - gcc-c++
        - gcc
        - make
        - python3
        - faugus-launcher
        - kde-connect
        - fastfetch
        - helium-bin
        - gh
        - libsixel
        - libsixel-utils
        - nerd-fonts
        - qemu
        - fwupd
        - aisleriot
        - qt6ct
        # pyprland runtime deps (the tool itself is pip-installed in the next module — no Fedora package)
        - python3-pip
        - python3-aiohttp
        - python3-aiofiles
        # Virtualisation: run and manage KVM guests. The `qemu` line above ships
        # the emulator itself (all targets, GTK/SDL/SPICE displays, virtiofsd,
        # OVMF firmware); these add the management layer VM tooling expects.
        # Host is an AMD Ryzen 5 5600G (svm exposed, kvm_amd loaded) and Fedora
        # ships /dev/kvm as mode 0666, so guests are hardware-accelerated with no
        # group setup. For qemu:///system without a polkit prompt, add the user to
        # the libvirt group once: sudo usermod -aG libvirt $USER
        - libvirt-daemon-kvm       # virtqemud + qemu driver + default NAT network
        - libvirt-client           # virsh
        - virt-install             # create guests from the CLI
        - virt-manager             # GUI
        - virt-viewer              # console viewer (SPICE/VNC)
        - swtpm                    # emulated TPM (Windows 11 guests)
        - edk2-ovmf                # UEFI firmware for guests (listed explicitly:
                                   # it was only arriving as a transitive dep)

      # Side-effect deps we do NOT want:
      #  - blender: negativo17's 1 GiB RPM declares Provides for a pile of libs Fedora
      #    ships separately (including libopenxr_loader.so.1), so the solver picks it
      #    as the provider instead of the real small package. qt6-qtquick3d (pulled in
      #    by kde-connect -> kde-connect-libs -> qt6-qtmultimedia) needs
      #    libopenxr_loader.so.1 -> blender got chosen over Fedora's openxr-libs.
      #    Verified in a base-main container: excluded = openxr-libs is used instead.
      #  - kitty: weak dep (Recommends) of hyprland; ghostty is Lee's terminal.
      exclude:
        - blender
        - kitty
        - firefox
-
  - type: script
    snippets:
      - wget https://installers.privateinternetaccess.com/download/pia-linux-3.7.2-08420.run
      - chmod +x pia-linux-3.7.2-08420.run
      - ./pia-linux-3.7.2-08420.run     
      
  - type: script
    snippets:
      # RustDesk remote-desktop client. Not packaged in Fedora or Terra, so take
      # the official release RPM and PIN the version — bump it deliberately.
      # Installs /usr/bin/rustdesk (1.4.9, 77 MB) plus its launcher entry and
      # hicolor icons.
      - curl -fsSL -o /tmp/rustdesk.rpm https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-0.x86_64.rpm
      - dnf5 -y install /tmp/rustdesk.rpm
      - rm -f /tmp/rustdesk.rpm
      # The RPM's own postinstall ENABLES rustdesk.service, which is unattended
      # INBOUND access (anyone holding the RustDesk ID can connect in). Ship it
      # off; per-machine opt-in:  sudo systemctl enable --now rustdesk.service
      # (the unit file stays under /usr/share/rustdesk/files/, the enable
      # symlink it creates lives in /etc/systemd/system/multi-user.target.wants/)
      - systemctl disable rustdesk.service

  - type: script
    snippets:
      # KDE Connect (kde-connect in the package list above) needs inbound TCP/UDP
      # 1714-1764, otherwise firewalld drops the phone's discovery replies and
      # connections — the paired device then never shows as reachable. Base's public
      # zone only ships ssh/mdns/dhcpv6-client. Offline tool = works during the build,
      # no firewalld daemon running.
      - firewall-offline-cmd --zone=public --add-service=kdeconnect

  - type: script
    snippets:
      # pyprland (scratchpads etc.) — not packaged for Fedora; pinned pip install from PyPI.
      # --prefix=/usr: base-main's /usr/local is an ostree symlink, files there don't survive
      # the commit. --no-deps: runtime deps come from the python3-* RPMs above.
      - python3 -m pip install --break-system-packages --no-deps --prefix=/usr pyprland==3.4.4

  - type: script
    snippets:
      # greetd setup (replaces sddm): greetd.service aliases display-manager.service,
      # which Fedora's graphical.target already Wants — enable alone is sufficient.
      - systemd-sysusers          # materialize the greetd system user (uid 999) at build time
      - mkdir -p /var/lib/noctalia-greeter
      - chown -R greetd:greetd /var/lib/greetd /var/lib/noctalia-greeter
      - cp /usr/share/ublue-hyprland/config/greetd/config.toml /etc/greetd/config.toml
      - bash /usr/share/noctalia-greeter/setup_greetd_pam.sh   # add pam_systemd session line (idempotent, backs up)
      # greetd execs the session command directly (no profile sourcing) — swap the Hyprland
      # session entry for a wrapper that sources /etc/profile first, so profile.d first-login
      # installers (ublue-hyprland.sh config copy) run for fresh users.
      - cp /usr/share/ublue-hyprland/config/wayland-sessions/hyprland.desktop /usr/share/wayland-sessions/hyprland.desktop
      - chmod +x /usr/share/ublue-hyprland/session-hyprland.sh
      # the files module doesn't preserve the exec bit, and these are bound
      # directly (Mod+L lock+suspend, screenshot submap)
      - chmod +x /usr/share/ublue-hyprland/scripts/*.sh
      - systemctl enable greetd.service
      - systemctl set-default graphical.target

  - type: script
    snippets:
      # DNS content filter: bake the adult-content blocklist into the image so it
      # filters from first boot. ublue-blocklist-update.timer refreshes it weekly
      # (dnsmasq reloads; see /etc/dnsmasq.d/ublue-filter.conf).
      - mkdir -p /etc/dnsmasq.hosts
      - bash /usr/share/ublue-hyprland/blocklist-update.sh

  - type: signing # sets up policy & signing files so the signed image verifies cleanly
