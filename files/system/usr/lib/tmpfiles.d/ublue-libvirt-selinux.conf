# libvirt's state directories (/var/lib/libvirt, images, dnsmasq, ...) are owned by
# libvirt-daemon-common as RPM file entries -- but an ostree/bootc image ships no /var
# content, so on the target those paths do NOT exist and the libvirt daemons create them
# themselves at first start. A runtime-created directory inherits its parent's label,
# which is var_lib_t, while Fedora's policy expects virt_var_lib_t for /var/lib/libvirt:
#
#   AVC avc: denied { write } for comm="rpc-virtnetwork" name="libvirt"
#       scontext=system_u:system_r:virtnetworkd_t:s0 tcontext=system_u:object_r:var_lib_t:s0
#   virtnetworkd: cannot create directory /var/lib/libvirt/dnsmasq: Permission denied
#
# The visible symptom is not a permission error at the CLI: libvirt's default NAT
# network simply never activates, so virt-install/virt-manager abort with
#   "Requested operation is not valid: network 'default' is not active"
#
# d: create the dir if it is missing. z: restore the policy SELinux context for the whole
# subtree at every boot (context only -- deliberately NOT "Z", which would also reset the
# mode/ownership libvirt picks for itself, e.g. 0711 root:root here and qemu:qemu below).
d /var/lib/libvirt 0711 root root -
z /var/lib/libvirt - - - -
