# ublue-hyprland: SELinux context for the Noctalia Greeter state directory.
#
# /var/lib/noctalia-greeter holds sync.toml (the appearance pushed by Noctalia's
# "Sync with Noctalia" feature) and the synced wallpapers. The greeter runs
# confined as xdm_t, and Fedora's policy grants xdm_t only READ access to the
# default var_lib_t label:
#   allow xdm_t var_lib_t:file { getattr ioctl lock map open read }
# so without this the greeter cannot save its own state and every boot logs
#   [WRN] [greeter-config] failed to replace '/var/lib/noctalia-greeter/sync.toml':
#       Permission denied
# (On a distro without SELinux enforcement, e.g. Arch, this never happens.)
# greetd's own state dir /var/lib/greetd is labelled xdm_var_lib_t by
# greetd-selinux; this does the same for the greeter's dir.
#
# `d` keeps the directory present with the right ownership. `Z` relabels it and
# everything inside on every boot — it takes NO explicit context argument (that
# would be ignored with a warning); the target label comes from the shipped
# rule in /etc/selinux/targeted/contexts/files/file_contexts.local:
#   /var/lib/noctalia-greeter(/.*)?    system_u:object_r:xdm_var_lib_t:s0
# so a full relabel, or a file the greeter creates itself, can never leave the
# path write-blocked again.
d /var/lib/noctalia-greeter 0750 greetd greetd -
Z /var/lib/noctalia-greeter - - - -
