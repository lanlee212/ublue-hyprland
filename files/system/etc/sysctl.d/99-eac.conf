# ublue-hyprland: disable kexec at boot.
#
# Easy Anti-Cheat Linux v2 (Epic's rebuilt Linux anti-cheat, shipping with
# Fortnite and later other titles) requires kexec to be disabled. Rationale from
# Epic's requirement list: kexec loads a new kernel without the normal boot flow,
# so the TPM measured-boot log no longer reflects the running kernel — it could
# be used to swap in a modified kernel to cheat without breaking attestation.
#
# kernel.kexec_load_disabled is a one-way latch: once set, kexec_file_load and
# kexec_load both fail with EPERM until reboot. Setting it here removes a
# root-level capability that nothing on this image uses (no kdump, no kexec-based
# fast reboot, no kexecbooting between ostree deployments — ostree reboots
# normally).
#
# This is the only EAC v2 requirement that can be satisfied from the image. The
# rest are machine/firmware side: TPM 2.0 enabled, Secure Boot enabled with
# factory keys (Fedora Secure Boot CA + Universal Blue MOK are both on Epic's
# well-known key list), IOMMU enabled with passthrough off, and lockdown
# integrity — which Fedora's kernel enables automatically once Secure Boot is on.
# Verify a machine with:
#   cat /proc/sys/kernel/kexec_load_disabled          # 1
#   mokutil --sb-state                                # SecureBoot enabled
#   cat /sys/kernel/security/lockdown                 # [integrity]
#   ls /sys/kernel/iommu_groups | wc -l               # non-zero
#   cat /sys/kernel/security/lsm                      # must contain bpf
kernel.kexec_load_disabled = 1
