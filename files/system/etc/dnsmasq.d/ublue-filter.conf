# ublue-hyprland: local filtering DNS resolver
#
# Every query on this machine is answered here (see /etc/resolv.conf +
# NetworkManager dns=none in /etc/NetworkManager/conf.d/90-ublue-dns.conf).
# Adult domains resolve to 0.0.0.0 via the baked blocklist, which is the
# StevenBlack porn-only list refreshed weekly by ublue-blocklist-update.timer.

port=53
listen-address=127.0.0.1
bind-interfaces            # loopback only — never become an open resolver

# Do NOT read /etc/resolv.conf (it points back at us) — use explicit upstreams.
no-resolv
server=9.9.9.9
server=1.1.1.1

domain-needed
bogus-priv
cache-size=1500

# Blocklist (hosts format: 0.0.0.0 <domain>), baked at build + weekly refresh.
addn-hosts=/etc/dnsmasq.hosts/porn.hosts
