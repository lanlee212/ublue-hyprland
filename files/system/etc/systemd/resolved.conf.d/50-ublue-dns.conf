# ublue-hyprland: send every systemd-resolved query to the local filtering
# resolver (dnsmasq on 127.0.0.1), which applies the adult-content blocklist.
# NetworkManager runs with dns=none so DHCP-provided DNS can't take precedence
# (see /etc/NetworkManager/conf.d/90-ublue-dns.conf).
[Resolve]
DNS=127.0.0.1
Domains=~.
